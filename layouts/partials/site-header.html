{{ $site := .Site.Data.site }}
<header class="site-header" data-header>
  <a class="brand-mark" href="{{ "/" | relURL }}" aria-label="{{ $site.brand.name }} home">{{ $site.brand.name }}</a>
  <nav class="site-nav" aria-label="Primary navigation">
    {{ range $site.navigation }}
      <a href="{{ .url | relURL }}">{{ .label }}</a>
    {{ end }}
  </nav>
  <button class="menu-button" type="button" aria-label="Toggle navigation" data-menu-toggle>
    <span></span>
    <span></span>
  </button>
</header>
